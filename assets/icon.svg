<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="8"/>
  
  <!-- Outer Gold Hexagon / Shield Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Pillars & Arch of Classical Financial Institution -->
  <!-- Roof Triangle / Pediment -->
  <polygon points="256,120 130,195 382,195" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Base Pediment Beam -->
  <rect x="120" y="195" width="272" height="18" rx="4" fill="url(#goldGrad)"/>
  
  <!-- 4 Classical Pillars -->
  <rect x="145" y="222" width="36" height="135" rx="6" fill="url(#goldGrad)"/>
  <rect x="209" y="222" width="36" height="135" rx="6" fill="url(#goldGrad)"/>
  <rect x="273" y="222" width="36" height="135" rx="6" fill="url(#goldGrad)"/>
  <rect x="337" y="222" width="36" height="135" rx="6" fill="url(#goldGrad)"/>

  <!-- Base Steps -->
  <rect x="120" y="365" width="272" height="16" rx="4" fill="url(#goldGrad)"/>
  <rect x="100" y="385" width="312" height="20" rx="6" fill="url(#goldGrad)"/>

  <!-- Emerald Verification Badge In Center -->
  <circle cx="256" cy="285" r="42" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <path d="M242,285 L252,295 L272,275" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
